[project]
name = "manager-bench"
version = "0.1.0"
description = "ManagerBench: Evaluating the Safety-Pragmatism Trade-off in Autonomous LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "google-genai>=1.30.0",
    "openai>=1.75.0",
    "psutil>=7.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
managed = true
